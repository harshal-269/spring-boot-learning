spring.application.name=message-service

# Default values for Instance A
server.port=${SERVER_PORT:8081}
app.instance-id=${INSTANCE_ID:Instance-A}

# Eureka Server
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Give each running instance a unique registry ID
eureka.instance.instance-id=${spring.application.name}:${server.port}:${app.instance-id}
eureka.instance.prefer-ip-address=true
