
spring.application.name=student-service
server.port=8081

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.cloud.openfeign.client.config.course-service.connect-timeout=3000
spring.cloud.openfeign.client.config.course-service.read-timeout=5000

spring.boot.admin.client.url=http://localhost:9090
spring.boot.admin.client.instance.service-base-url=http://localhost:8081

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true

info.app.name=Student Service
info.app.description=Microservice for managing sample students
info.app.version=1.0.0
