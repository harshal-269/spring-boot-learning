
spring.application.name=api-gateway
server.port=8085

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Student Service route
spring.cloud.gateway.server.webflux.routes[0].id=student-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://STUDENT-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/students/**

# Course Service route
spring.cloud.gateway.server.webflux.routes[1].id=course-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://COURSE-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/courses/**

# Spring Boot Admin
spring.boot.admin.client.url=http://localhost:9090
spring.boot.admin.client.instance.service-base-url=http://localhost:8080

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true

info.app.name=API Gateway
info.app.description=Gateway for Student and Course services
info.app.version=1.0.0
